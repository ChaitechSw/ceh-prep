name: Update Study Progress

on:
  push:
    branches: [main]
  schedule:
    # Runs daily at midnight UTC — keeps README badge current
    - cron: "0 0 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  update-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate progress report
        run: node scripts/generate-progress.js

      - name: Commit updated README (if changed)
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update study progress [skip ci]"
          git push
